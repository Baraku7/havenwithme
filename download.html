<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Haven — Download the App</title>
<meta name="description" content="Haven — your AI Therapist, always here. Download free on iOS and Android."/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#0D0D12;
  --slate:#6B6B8A;
  --mist:#A8A8C0;
  --snow:#F5F5FA;
  --white:#FFFFFF;
  --haven:#5B4FE8;
  --haven2:#7B6FF0;
  --haven3:#A89CF7;
  --teal:#2EC4B6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:radial-gradient(120% 140% at 50% -10%, #1b1440 0%, #0a0a16 55%, #07070f 100%);
  color:var(--snow);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  overflow-x:hidden;
}
.wrap{
  width:100%;
  max-width:400px;
  text-align:center;
}

/* Signature living orb — same motif as the app */
.orb-field{position:relative;width:120px;height:120px;margin:0 auto 28px;}
.orb-halo{
  position:absolute;inset:-42px;border-radius:50%;
  background:radial-gradient(circle, rgba(123,111,240,0.35) 0%, rgba(46,196,182,0.12) 45%, transparent 72%);
  filter:blur(2px);
  animation:haloBreathe 8s ease-in-out infinite;
}
.orb{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #a89cf7 0%, #5B4FE8 42%, #2EC4B6 100%);
  box-shadow:0 0 60px rgba(91,79,232,0.45), inset 0 0 30px rgba(255,255,255,0.15);
  animation:orbBreathe 8s ease-in-out infinite;
}
.orb::after{
  content:'';position:absolute;inset:14%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%, rgba(255,255,255,0.5), transparent 60%);
}
@keyframes orbBreathe{
  0%,100%{transform:scale(0.86);}
  35%,50%{transform:scale(1.06);}
  85%{transform:scale(0.86);}
}
@keyframes haloBreathe{
  0%,100%{transform:scale(0.8);opacity:0.55;}
  35%,50%{transform:scale(1.15);opacity:0.9;}
  85%{transform:scale(0.8);opacity:0.55;}
}
@media (prefers-reduced-motion: reduce){
  .orb, .orb-halo{animation:none;}
}

.eyebrow{
  font-size:11px;font-weight:600;color:#8a7cf0;letter-spacing:0.18em;
  text-transform:uppercase;margin-bottom:14px;
}
.headline{
  font-family:'Fraunces',serif;font-size:30px;font-weight:400;
  color:rgba(255,255,255,0.96);line-height:1.25;letter-spacing:-0.02em;
  margin-bottom:12px;
}
.headline em{color:#b8acf5;font-style:italic;}
.tagline{
  font-size:14px;color:rgba(255,255,255,0.45);line-height:1.7;
  font-weight:300;max-width:300px;margin:0 auto 36px;
}

.buttons{display:flex;flex-direction:column;gap:12px;margin-bottom:28px;}
.store-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 20px;border-radius:14px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);
  color:#fff;text-decoration:none;
  font-size:15px;font-weight:500;
  transition:transform 0.15s, background 0.15s, border-color 0.15s;
}
.store-btn:active{transform:scale(0.97);}
.store-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.24);}
.store-btn.primary{
  background:linear-gradient(135deg, var(--haven) 0%, #4a3fd0 45%, var(--teal) 100%);
  border:none;
  box-shadow:0 14px 30px rgba(91,79,232,0.32);
}
.store-icon{width:20px;height:20px;flex-shrink:0;}
.btn-text{display:flex;flex-direction:column;align-items:flex-start;}
.btn-text .small{font-size:10px;color:rgba(255,255,255,0.55);line-height:1.3;}
.btn-text .big{font-size:15px;font-weight:600;line-height:1.3;}
.store-btn.primary .small{color:rgba(255,255,255,0.75);}

.footer-note{
  font-size:12px;color:rgba(255,255,255,0.3);
  line-height:1.7;
}
.footer-note a{color:rgba(255,255,255,0.45);text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <div class="orb-field">
    <div class="orb-halo"></div>
    <div class="orb"></div>
  </div>

  <div class="eyebrow">Haven</div>
  <div class="headline">Your AI Therapist,<br><em>always here.</em></div>
  <div class="tagline">Talk it out. Breathe. Find your calm — any hour, any day.</div>

  <div class="buttons">
    <a class="store-btn primary" href="https://apps.apple.com/us/app/haven-ai-mental-health/id6791464048" target="_blank" rel="noopener" onclick="window.havenTrackTap&&window.havenTrackTap('appstore')">
      <svg class="store-icon" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 4 184.8 4 273.6c0 26.2 4.8 53.3 14.4 81.3 12.8 37.3 59 128.8 107.2 127.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-84 102.6-121.4-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      <span class="btn-text">
        <span class="small">Download on the</span>
        <span class="big">App Store</span>
      </span>
    </a>
    <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.havenwithme.app" target="_blank" rel="noopener" onclick="window.havenTrackTap&&window.havenTrackTap('googleplay')">
      <svg class="store-icon" viewBox="0 0 512 512" fill="currentColor"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
      <span class="btn-text">
        <span class="small">Get it on</span>
        <span class="big">Google Play</span>
      </span>
    </a>
  </div>

  <div class="footer-note">Free to try · No credit card required</div>
</div>
<script>
(function () {
  var ENDPOINT = "https://haven-analytics.baraku7.workers.dev/collect";
  try {
    var KEY = "haven_anon_id";
    var id = localStorage.getItem(KEY);
    if (!id) {
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
      localStorage.setItem(KEY, id);
    }
    function track(event, props) {
      try {
        var body = JSON.stringify({ id: id, event: event, ts: Date.now(), platform: "download_page", props: props || {} });
        if (navigator.sendBeacon) navigator.sendBeacon(ENDPOINT, body);
        else fetch(ENDPOINT, { method: "POST", body: body, keepalive: true, headers: { "Content-Type": "application/json" } });
      } catch (e) {}
    }
    window.havenTrackTap = function(store) { track("tap_" + store); };
    track("download_page_view");
  } catch (e) {}
})();
</script>
</body>
</html>
